# Purpose: Auto-approve Dependabot pull requests using the same GitHub App
# identity as the OPA version-bump workflow. Uses pull_request_target so App
# secrets are available (Dependabot-triggered pull_request runs cannot access
# repository secrets).

name: Dependabot Auto-approve

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions: read-all

jobs:
  auto-approve:
    name: Auto-approve PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/auto-approve-pr.yml
    with:
      pr-url: ${{ github.event.pull_request.html_url }}
    secrets:
      client_id: ${{ secrets.SCUBA_AUTO_REVIEWER_CLIENT_ID }}
      private_key: ${{ secrets.SCUBA_AUTO_REVIEWER_PRIVATE_KEY }}
