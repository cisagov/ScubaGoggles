# Purpose: Build and draft a GitHub release with categorized release notes

name: Build Draft Release

on:
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7:Manual inputs are desired.
      releaseName:
        description: "Release Name (e.g., 1.0.0)"
        required: true
        type: string
      # Note: This should match __version__ in scubagoggles/__init__.py.
      version:
        description: "Release Version (e.g., 1.0.0)"
        required: true
        type: string
      compareHeadRef:
        description: "Compare head ref (branch, tag, or SHA) for release notes, e.g. main or release/1.0.0. Defaults to the commit SHA of the workflow run."
        required: false
        type: string
        default: ""

permissions: read-all

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: tcort/github-action-markdown-link-check@v1
      with:
        base-branch: 'main'
        config-file: 'mlc_config.json'
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'

  build-and-deploy:
    needs: markdown-link-check
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NAME: ${{ inputs.releaseName }}
      COMPARE_HEAD_REF: ${{ inputs.compareHeadRef }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up OSCAL CLI
        uses: ./.github/actions/setup-oscal-cli

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Package Repo for release
        shell: bash
        run: |
          reqv="${RELEASE_VERSION}"
          reqv="${reqv//[[:space:]]/}"
          [[ ! "$reqv" =~ ^[0-9]{1,2}(\.[0-9]{1,2}){2}$ ]] \
            && echo "invalid request version: $reqv" && exit 1
          sgv=$(grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' scubagoggles/__init__.py)
          [[ "$reqv" == "$sgv" ]] \
            || (echo "version mismatch - current: $sgv" && exit 1)
          ./scubagoggles/utils/build.sh -r "$PWD" -t "$GITHUB_REF_NAME"
      - name: Generate OSCAL baseline catalog artifact
        shell: bash
        run: |
          python3 scubagoggles/utils/generate_oscal_baselines.py \
            --input-dir scubagoggles/baselines \
            --output-dir dist/oscal-baseline-catalog \
            --release-version "$RELEASE_VERSION"
          CATALOG_FILE="$(python3 scubagoggles/utils/validate_oscal_baselines.py \
            --output-dir dist/oscal-baseline-catalog \
            --release-version "$RELEASE_VERSION" \
            --print-catalog-path)"
          oscal-cli --version
          oscal-cli validate "$CATALOG_FILE"
          cd dist
          zip -r "scubagoggles-oscal-baseline-catalog-v${RELEASE_VERSION}.zip" oscal-baseline-catalog

      - name: Get previous release tag
        id: previous-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python utils/workflow/release_notes.py previous-tag

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_TAG: ${{ steps.previous-release.outputs.tag }}
        run: python utils/workflow/release_notes.py generate

      - name: Show release notes
        run: |
          echo "::group::Generated release notes"
          cat release-body.md
          echo "::endgroup::"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: create_release
        with:
          draft: true
          prerelease: false
          name: v${{ inputs.releaseName }}
          tag_name: v${{ inputs.version }}
          body_path: release-body.md
          files: |
            scubagoggles-*-py3-none-any.whl
            scubagoggles-*.tar.gz
            scubagoggles-*.zip
            dist/scubagoggles-oscal-baseline-catalog-v${{ inputs.version }}.zip
          fail_on_unmatched_files: true
