on:
  workflow_dispatch:
    inputs:
      releaseName:
        description: "Release Name (e.g., 1.2.4)"
        required: true
        type: string
      version:
        description: "Release Version (e.g., 1.2.4)"
        required: true
        type: string

name: Build Draft Release

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: tcort/github-action-markdown-link-check@v1
      with:
        base-branch: 'main'
        config-file: 'mlc_config.json'
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'

  build-and-deploy:
    needs: markdown-link-check
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      RELEASE_VERSION: ${{ inputs.version }}
      OSCAL_CLI_VERSION: "3.2.0"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Java
        uses: actions/setup-java@v7
        with:
          distribution: temurin
          java-version: "17"
      - name: Install OSCAL CLI
        shell: bash
        run: |
          OSCAL_CLI_ZIP="$RUNNER_TEMP/oscal-cli.zip"
          curl --fail --location --retry 3 --output "$OSCAL_CLI_ZIP" \
            "https://repo1.maven.org/maven2/dev/metaschema/oscal/oscal-cli-enhanced/${OSCAL_CLI_VERSION}/oscal-cli-enhanced-${OSCAL_CLI_VERSION}-oscal-cli.zip"
          unzip -q "$OSCAL_CLI_ZIP" -d "$RUNNER_TEMP/oscal-cli"
          echo "$RUNNER_TEMP/oscal-cli/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Package Repo for release
        shell: bash
        run: |
          reqv="${{ inputs.version }}"
          reqv="${reqv//[[:space:]]/}"
          [[ ! "$reqv" =~ ^[0-9]{1,2}(\.[0-9]{1,2}){2}$ ]] \
            && echo "invalid request version: $reqv" && exit 1
          sgv=$(grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' scubagoggles/__init__.py)
          [[ "$reqv" == "$sgv" ]] \
            || (echo "version mismatch - current: $sgv" && exit 1)
          ./scubagoggles/utils/build.sh -r "$PWD" -t "$GITHUB_REF_NAME"
      - name: Generate OSCAL baseline catalog artifact
        shell: bash
        run: |
          python3 scubagoggles/utils/generate_oscal_baselines.py \
            --input-dir scubagoggles/baselines \
            --output-dir dist/oscal-baseline-catalog \
            --release-version "$RELEASE_VERSION"
          CATALOG_FILE="$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('dist/oscal-baseline-catalog/generation-summary.json').read_text(encoding='utf-8'))['output'])")"
          expected_prefix="scubagoggles-v${RELEASE_VERSION}-oscal-catalog-oscal-"
          [[ "$CATALOG_FILE" == "${expected_prefix}"*.json ]] \
            || (echo "invalid OSCAL catalog filename: $CATALOG_FILE" && exit 1)
          oscal-cli --version
          oscal-cli validate "dist/oscal-baseline-catalog/${CATALOG_FILE}"
          cd dist
          zip -r "scubagoggles-oscal-baseline-catalog-v${RELEASE_VERSION}.zip" oscal-baseline-catalog
      - name: release
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          draft: true
          prerelease: false
          name: v${{ inputs.releaseName }}
          tag_name: v${{ inputs.version }}
          files: |
            scubagoggles-*-py3-none-any.whl
            scubagoggles-*.tar.gz
            scubagoggles-*.zip
            dist/scubagoggles-oscal-baseline-catalog-v${{ inputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
